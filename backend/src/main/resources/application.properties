spring.application.name=TecSpace
server.port=8080

# ---- MongoDB ----
spring.data.mongodb.uri=mongodb://localhost:27017/tecspace
spring.data.mongodb.auto-index-creation=true

# ---- JWT (secret must be at least 32 characters; change it for production!) ----
tecspace.jwt.secret=ChangeThisSecretToSomethingLongAndRandom_TecSpace_2026
tecspace.jwt.expiration-ms=86400000

# ---- CORS (React dev server) ----
tecspace.cors.allowed-origins=http://localhost:5173

# ---- Default admin account (created on first start) ----
tecspace.admin.email=admin@tecspace.edu
tecspace.admin.password=Admin@12345

# ---- Default tuition assigned to a new student ----
tecspace.default-fee=12000.00

# ---- QR payments ----
# How long a generated QR stays valid
tecspace.payment.qr-expiry-minutes=10
# DEMO ONLY: lets the /pay/<token> page confirm a payment. Set to false for real use and
# confirm payments from your payment provider's webhook instead.
tecspace.payment.simulate-confirm=true
